# Phase 4 (ansible seal-tokens): one seal token per cluster node from the
# token role autounseal (Terraform, phase 3), with the ansible-seal token.
- name: Issue the per-node seal tokens
  hosts: localhost
  gather_facts: false
  vars:
    seal_tokens_nodes: [vault-1, vault-2, vault-3]
  roles:
    - seal_tokens
