# validate (ansible, the last phase of make lab): read-only. Saskia signs in
# the way she does on the console (Keycloak, then Vault's jwt auth) and her
# own token's capabilities are exactly vult-presenter's on the paths that
# matter: she may revoke one booking lease and rotate the deploy token, and
# may not read a legacy value, mint the app's secret id or take a database
# credential. The before estate's pieces are where the act says they are.
# Nothing here reads or prints a secret value; her token is revoked at the end.
- name: Validate the presenter and the estate
  hosts: localhost
  gather_facts: false
  vars:
    v_ns: "{{ vult_cluster_addr }}/v1/{{ vult_namespace }}"
    story: "{{ lookup('ansible.builtin.file', vult_root + '/config/story.json') | from_json }}"
    act_now: "{{ lookup('ansible.builtin.pipe', 'cat ' + vult_root + '/.build/act 2>/dev/null || echo 0') | trim | int }}"
    # A list, not a dict: Ansible does not template a dict's keys.
    expect:
      - { path: "sys/leases/revoke/database/creds/booking/x", caps: [update] }
      - { path: "kv/data/{{ story.rotate }}", caps: [create, read, update] }
      - { path: "kv/data/{{ story.legacy[0].kv_name }}", caps: [create, update] }
      - { path: "auth/approle/role/booking/secret-id", caps: [deny] }
      - { path: "database/creds/booking", caps: [deny] }
      - { path: "sys/sync/github-apps/x", caps: [deny] }
  tasks:
    - name: Saskia signs in to Keycloak (through the LDAP federation)
      ansible.builtin.uri:
        url: "{{ vult_keycloak_url }}/realms/tidewell/protocol/openid-connect/token"
        method: POST
        ca_path: "{{ vult_ca }}"
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: tidewell-cli
          username: "{{ story.presenter.user }}"
          password: "{{ lookup('ansible.builtin.file', vult_root + '/.secrets/people/' + story.presenter.user) | trim }}"
      register: kc
      no_log: true
      check_mode: false

    - name: Her own Vault token (jwt, role person)
      ansible.builtin.uri:
        url: "{{ v_ns }}/auth/jwt/login"
        method: POST
        ca_path: "{{ vult_ca }}"
        body_format: json
        body: { role: person, jwt: "{{ kc.json.access_token }}" }
      register: login
      no_log: true
      check_mode: false

    - name: She holds vult-presenter through her group, nothing more
      ansible.builtin.assert:
        that:
          - login.json.auth.identity_policies == ['vult-presenter']
          - login.json.auth.token_policies == ['default']
        quiet: true

    - name: Her capabilities on the paths that matter
      ansible.builtin.uri:
        url: "{{ v_ns }}/sys/capabilities-self"
        method: POST
        ca_path: "{{ vult_ca }}"
        headers: { X-Vault-Token: "{{ login.json.auth.client_token }}" }
        body_format: json
        body: { paths: "{{ expect | map(attribute='path') | list }}" }
      register: caps
      no_log: true
      check_mode: false

    - name: Exactly as declared
      ansible.builtin.assert:
        that: "(caps.json.data[item.path] | sort) == (item.caps | sort)"
        fail_msg: "{{ item.path }}: {{ caps.json.data[item.path] | default('none') }}, expected {{ item.caps }}"
        quiet: true
      loop: "{{ expect }}"
      loop_control: { label: "{{ item.path }}" }

    - name: Her token is done
      ansible.builtin.uri:
        url: "{{ v_ns }}/auth/token/revoke-self"
        method: POST
        ca_path: "{{ vult_ca }}"
        headers: { X-Vault-Token: "{{ login.json.auth.client_token }}" }
        status_code: [204]
      changed_when: false
      no_log: true
      check_mode: false

    - name: Where the act says the static password is (booking.env)
      ansible.builtin.command: "grep -c '^DB_PASSWORD=' {{ vult_root }}/.secrets/workload/booking.env"
      register: dbline
      changed_when: false
      failed_when: (dbline.stdout | int) != (1 if (act_now | int) < 2 else 0)
      check_mode: false

    - name: The booking app answers, on the credential the act says
      ansible.builtin.uri:
        url: "{{ vult_booking_url }}/healthz"
        ca_path: "{{ vult_ca }}"
      register: health
      failed_when: health.json.database != 'up' or health.json.credential != ('booking.env' if (act_now | int) < 2 else 'vault-agent')
      check_mode: false
