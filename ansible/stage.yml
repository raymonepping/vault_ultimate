# Phase 13 (ansible stage): the story's starting point, checked and written
# to .build/stage/stage.json. Nothing is imported or synced yet: the
# presenter does that through the console.
- name: The stage
  hosts: localhost
  gather_facts: false
  vars:
    stage_story: "{{ lookup('ansible.builtin.file', vult_root + '/config/story.json') | from_json }}"
  roles:
    - stage
