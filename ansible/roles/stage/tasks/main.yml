# stage. Read-only on Vault and LocalStack; writes only .build/stage/.

- name: The destinations and their associations
  ansible.builtin.uri:
    url: "{{ stage_ns }}/sys/sync/destinations/{{ item.type }}/{{ item.name }}/associations"
    ca_path: "{{ vult_ca }}"
    headers: { X-Vault-Token: "{{ stage_token }}" }
  loop: "{{ stage_destinations }}"
  loop_control:
    label: "{{ item.name }}"
  register: stage_assoc
  check_mode: false

- name: The imported paths (kv/parcel/)
  ansible.builtin.uri:
    url: "{{ stage_ns }}/kv/metadata/parcel?list=true"
    ca_path: "{{ vult_ca }}"
    headers: { X-Vault-Token: "{{ stage_token }}" }
    status_code: [200, 404]
  register: stage_kv
  check_mode: false

- name: Ensure .build/stage
  ansible.builtin.file:
    path: "{{ vult_root }}/.build/stage"
    state: directory
    mode: "0755"

# Names and counts only: which legacy secrets exist, what is imported, how
# many secrets each destination carries.
- name: The stage file
  ansible.builtin.copy:
    dest: "{{ vult_root }}/.build/stage/stage.json"
    mode: "0644"
    content: >-
      {{ {'legacy': stage_story.legacy | map(attribute='aws_name') | list,
          'imported': (stage_kv.json.data['keys'] if stage_kv.status == 200 else []),
          'associations': dict(stage_destinations | map(attribute='name')
                          | zip(stage_assoc.results | map(attribute='json.data.associated_secrets') | map('length')))}
         | to_nice_json }}
