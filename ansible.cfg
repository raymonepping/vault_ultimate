# ansible.cfg: run Ansible only through scripts/ansible.sh (it sets
# ANSIBLE_CONFIG to this file and handles Ansible's blocking-stdio check).
# Every play runs on localhost against the Vault HTTPS API.
[defaults]
inventory          = ansible/inventory.yml
roles_path         = ansible/roles
callback_plugins   = ansible/plugins/callback
callbacks_enabled  = vult_stats
stdout_callback    = ansible.builtin.default
result_format      = yaml
retry_files_enabled = False
# Never persist facts: they could carry environment-derived values.
fact_caching       = memory
interpreter_python = auto_silent
nocows             = True
