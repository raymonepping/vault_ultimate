# compose/data/compose.yaml: PostgreSQL, Tidewell's booking database. Nothing
# is published on the host: Vault, the booking app and the witness reach it on
# vult-internal at a fixed address (Vault's database connection and the
# booking app's role are bound to it). From vault_identity.
#
# Local (socket) connections use peer auth: only `podman exec -u postgres`
# reaches the superuser without a password (Ansible's schema phase). Network
# connections need TLS 1.3 (the lab certificate, SAN postgres) and SCRAM:
# pg_hba.conf refuses anything else. The bootstrap password is handed to
# Vault's database connection once and then rotated away (act 2).
#
# Connection evidence (D19): connections and disconnections are logged as
# jsonlog into the pg-log volume, which the API mounts read-only. No
# statement logging: CREATE ROLE ... PASSWORD would land in the log.

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: vult-postgres
    hostname: postgres
    # Postgres creates a missing log_directory 0700, and the API (uid 1000)
    # must read it: the entrypoint, still root, prepares the volume root 0755
    # for uid 70 (postgres) before the image's own entrypoint drops privileges.
    entrypoint:
      - sh
      - -c
      - >-
        chown 70:70 /var/log/postgresql && chmod 0755 /var/log/postgresql &&
        install -m 0644 -o 70 -g 70 /tls-src/vault.crt /var/run/postgresql/server.crt &&
        install -m 0600 -o 70 -g 70 /tls-src/vault.key /var/run/postgresql/server.key &&
        exec docker-entrypoint.sh "$$@"
      - --
    environment:
      POSTGRES_DB: tidewell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-bootstrap
      POSTGRES_INITDB_ARGS: "--auth-local=peer --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql.log
      - -c
      - log_file_mode=0644
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=none
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/run/postgresql/server.crt
      - -c
      - ssl_key_file=/var/run/postgresql/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-log:/var/log/postgresql
      - ../../.secrets/data/pg-bootstrap:/run/secrets/pg-bootstrap:ro
      - ../../vault-tls:/tls-src:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      default:
        ipv4_address: ${VULT_POSTGRES_IP}
        aliases: [postgres]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "gosu postgres pg_isready -U postgres -d tidewell"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  default:
    name: vult-internal
    external: true

volumes:
  pg-data:
    name: vult-pg_data
    labels: { io.vult.data: "true" }
  pg-log:
    name: vult-pg_log
    labels: { io.vult.data: "true" }
