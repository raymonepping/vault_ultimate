# compose/app/compose.yaml: the Tidewell Ferries console (prompts 08, 09).
#
#   web-init  one-shot: the web certificate for nginx (uid 101)
#   api       the presenter's desk: Saskia's Vault token lives only in its
#             memory (D14); it reads the lab's records (.build, read-only) and
#             asks the host runner (runner/server.js, make app-up starts it)
#             for the waves, the witness and the reset
#   web       nginx over TLS 1.3; the React console, /api and /auth to the API
#
# No credential is mounted: Saskia signs in through Keycloak. The one secret
# the API reads is the runner's token (a fresh one per runner start), inside
# the read-only .build mount. Images: make app-build.

services:
  web-init:
    image: ${ALPINE_IMAGE}
    container_name: vult-web_init
    user: "0:0"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -m 0750 -o 101 -g 101 /web-tls &&
        install -m 0644 -o 101 -g 101 /src/vault.crt /web-tls/web.crt &&
        install -m 0600 -o 101 -g 101 /src/vault.key /web-tls/web.key &&
        install -m 0644 -o 101 -g 101 /src/ca-chain.pem /web-tls/ca-chain.pem &&
        echo '[web-init] done'
    volumes:
      - web-tls:/web-tls
      - ../../vault-tls:/src:ro
    restart: "no"

  api:
    image: ${VULT_IMAGE_PREFIX}/api:${VULT_IMAGE_TAG}
    container_name: vult-api
    hostname: api
    # The lab's records under .build are 0700 on the Mac, owned by the Mac
    # user, which rootless Podman maps to uid 0 in the container (and to no
    # privilege on the host). Every capability is dropped, the root file
    # system is read-only and .build is mounted read-only.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORT: "3000"
      HOME: /tmp
      VAULT_NODES: https://vault-1:8200,https://vault-2:8200,https://vault-3:8200
      VULT_NAMESPACE: ${VULT_NAMESPACE}
      STORY_FILE: /app/config/story.json
      BUILD_DIR: /build
      RUNNER_URL: http://host.containers.internal:${VULT_RUNNER_PORT}
      RUNNER_TOKEN_FILE: /build/run/runner.token
      KEYCLOAK_PUBLIC: https://localhost:${VULT_PORT_KEYCLOAK}/realms/tidewell
      KEYCLOAK_INTERNAL: https://keycloak:8443/realms/tidewell
      BOOKING_URL: https://booking:8443
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${VULT_OLLAMA_MODEL}
      CONSOLE_USER: saskia
      SESSION_IDLE_SECONDS: "${VULT_SESSION_IDLE}"
      CONSOLE_URL: https://localhost:${VULT_PORT_WEB},https://127.0.0.1:${VULT_PORT_WEB}
      NODE_EXTRA_CA_CERTS: /etc/vult/ca-chain.pem
    volumes:
      - ../../vault-tls/ca-chain.pem:/etc/vult/ca-chain.pem:ro
      - ../../.build:/build:ro
    mem_limit: 384m
    networks: [default]
    restart: unless-stopped

  web:
    image: ${VULT_IMAGE_PREFIX}/web:${VULT_IMAGE_TAG}
    container_name: vult-web
    hostname: web
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    ports: ["127.0.0.1:${VULT_PORT_WEB}:8443"]
    volumes:
      - web-tls:/etc/nginx/tls:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      web-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

networks:
  default:
    name: vult-internal
    external: true

volumes:
  web-tls: {}
