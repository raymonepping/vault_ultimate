# config/defaults.conf: tracked defaults for image pins, host ports and names.
# scripts/compose.sh loads this file first and .env second, so any value can
# be overridden in .env without editing a compose file. Identifiers only:
# never a secret. Dependabot cannot parse this file: bump images by hand, then
# run make verify, make rehearsal and make probe.

# ── Images (arm64; check Architecture after every pull) ───────────────────────
# All local and arm64 on 2026-11-13 except Ollama 0.40.16 (D1, D8).
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
KEYCLOAK_IMAGE=docker.io/keycloak/keycloak:26.8.1
OPENLDAP_IMAGE=docker.io/osixia/openldap:1.5.0
POSTGRES_IMAGE=docker.io/library/postgres:17.11-alpine
LOCALSTACK_IMAGE=docker.io/localstack/localstack:2026.10.6
OLLAMA_IMAGE=docker.io/ollama/ollama:0.40.16
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
ALPINE_IMAGE=docker.io/library/alpine:3.24.1

# ── Host ports (all published on 127.0.0.1) ───────────────────────────────────
# Not in any sibling lab's defaults.conf on 2026-11-13. PostgreSQL, OpenLDAP,
# Ollama, the AI agent and the console API are not published.
VULT_PORT_VAULT_S=19700
VULT_PORT_VAULT_1=19701
VULT_PORT_VAULT_2=19702
VULT_PORT_VAULT_3=19703
VULT_PORT_WEB=14201
VULT_PORT_BOOKING=14202
VULT_PORT_KEYCLOAK=14203
VULT_PORT_LOCALSTACK=14666

# ── Network (a fixed subnet: Vault reaches LocalStack and PostgreSQL at known addresses)
VULT_SUBNET=10.89.28.0/24
VULT_LOCALSTACK_IP=10.89.28.50
VULT_POSTGRES_IP=10.89.28.60
VULT_BOOKING_IP=10.89.28.70

# ── Vault ─────────────────────────────────────────────────────────────────────
VULT_NAMESPACE=tidewell
VULT_SESSION_IDLE=14400
# The app's database lease, its certificate and the wrapped secret id (D6, D9).
VULT_LEASE_TTL=15m
VULT_CERT_TTL=1h
VULT_WRAP_TTL=60s

# ── Ollama (D8: internal only, capped so it cannot starve Vault) ──────────────
VULT_OLLAMA_MODEL=llama3.2:3b
VULT_OLLAMA_CANDIDATES=qwen3:4b qwen2.5:1.5b
VULT_OLLAMA_CPUS=4
VULT_OLLAMA_MEMORY=6g
VULT_OLLAMA_TIMEOUT_MS=20000

# ── Disk gate (D20): free GiB the Mac needs before a pull or build ────────────
VULT_DISK_MIN_GIB=20
# Before a build on local base images (a few hundred MB at most).
VULT_DISK_BUILD_GIB=12
# Below this the lab does not run at all; between the two, make lab warns.
VULT_DISK_FLOOR_GIB=8

# ── GitHub (identifiers, not secrets; the app's key is in .secrets/github/) ──
VULT_GITHUB_OWNER=raymonepping
VULT_GITHUB_REPO=vault_ultimate
VULT_GITHUB_APP_ID=5725774
VULT_GITHUB_APP_NAME=vaultsyncdemo
# One installation of the app on the account, with vault_sync and
# vault_ultimate selected; the probe (prompt 03) confirms it for this repo.
VULT_GITHUB_INSTALLATION_ID=181185657

# ── LocalStack (synthetic AWS credentials: an emulator, never real AWS) ──────
VULT_AWS_REGION=eu-west-1

# ── Application images (make app-build) ───────────────────────────────────────
VULT_IMAGE_PREFIX=localhost/vault-ultimate
VULT_IMAGE_TAG=local
